services:
  - type: web
    name: deepresearch-ai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/scripts/export_onnx_model.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_PRIMARY_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_REQUEST_TIMEOUT_MS
        value: "120000"
      - key: GEMINI_MAX_ATTEMPTS
        value: "2"